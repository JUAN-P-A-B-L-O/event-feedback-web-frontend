limit_req_zone $binary_remote_addr zone=survey:10m rate=30r/m;
map $uri $service_upstream {
    default "";
    ~^/api/auth(?:/|$) "${ORGANIZER_UPSTREAM}";
    ~^/api/(?:events|public)(?:/|$) "${SURVEY_UPSTREAM}";
}
map $service_upstream $api_upstream {
    "" "${API_UPSTREAM}";
    default $service_upstream;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Referrer-Policy no-referrer always;
    client_max_body_size 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_ssl_server_name on;

    location /api/public/surveys/ {
        access_log off;
        error_log /dev/null;
        limit_req zone=survey burst=30 nodelay;
        limit_req_status 429;
        if ($api_upstream = "") { return 503; }
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /s/ {
        access_log off;
        error_log /dev/null;
        try_files $uri /index.html;
    }

    location /api/ {
        if ($api_upstream = "") { return 503; }
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
