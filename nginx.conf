limit_req_zone $binary_remote_addr zone=survey:10m rate=30r/m;
map $uri $service_upstream {
    default "";
    ~^/api/auth(?:/|$) "${ORGANIZER_UPSTREAM}";
    ~^/api/(?:events|public)(?:/|$) "${SURVEY_UPSTREAM}";
}
map $service_upstream $api_upstream {
    "" "${API_UPSTREAM}";
    default $service_upstream;
}
server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    add_header Referrer-Policy no-referrer always;
    client_max_body_size 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_ssl_server_name on;
    # Only locally generated gateway failures use these handlers. Upstream
    # HTTP errors keep their original status, headers and body.
    proxy_intercept_errors off;
    error_page 502 = @api_bad_gateway;
    error_page 504 = @api_gateway_timeout;

    location @api_bad_gateway {
        default_type application/json;
        return 502 '{"error":"API unavailable"}';
    }

    location @api_gateway_timeout {
        default_type application/json;
        return 504 '{"error":"API timeout"}';
    }

    location /api/public/surveys/ {
        default_type application/json;
        access_log off;
        error_log /dev/null;
        limit_req zone=survey burst=30 nodelay;
        limit_req_status 429;
        if ($api_upstream = "") { return 503 '{"error":"API unavailable"}'; }
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect $api_upstream/ /;
    }

    location /s/ {
        access_log off;
        error_log /dev/null;
        try_files $uri /index.html;
    }

    location = /api {
        default_type application/json;
        return 404 '{"error":"API route not found"}';
    }

    location /api/ {
        default_type application/json;
        if ($api_upstream = "") { return 404 '{"error":"API route not found"}'; }
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect $api_upstream/ /;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
